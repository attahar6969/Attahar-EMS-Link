<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>EMPLOYEE MANAGEMENT</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000000; }
  /* spinner shows behind the app while it loads, so there is never a blank blue/white tab */
  .ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  .ld i { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #2b2b2b; border-top-color: #fff; animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  iframe { position: relative; z-index: 1; border: 0; width: 100%; height: 100%; display: block; background: #000; }
</style>
</head>
<body>
<div class="ld"><i></i></div>
<iframe src="https://script.google.com/macros/s/AKfycbyj3p022HBsRIeS1Ds7ghkcUv_30Bx5eg0Nnx6BTmctseNwhDylOVi43vunWoVHpZp5/exec"
            allow="camera *; microphone *; geolocation *"></iframe>
</body>
</html>
